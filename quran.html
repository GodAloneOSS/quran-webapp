<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Reader</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React library -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Excel file reader -->
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Beautiful Arabic font -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        /* Hide WordPress admin bar if logged in */
        #wpadminbar {
            display: none !important;
        }
        
        html {
            margin-top: 0 !important;
        }
    </style>
</head>
<body>
    <!-- This is where the Quran Reader will appear -->
    <div id="root"></div>
    
    <script type="text/babel">
        // IMPORTANT: Change this filename to match your Excel file!
        const EXCEL_FILE_NAME = '/quran-data.xlsx';
        
        // Icon components
        const { Search, BookmarkPlus, BookmarkCheck, Book, Menu, X } = lucide;
        
        // Main Quran Reader Application
        const QuranReader = () => {
            const [verses, setVerses] = React.useState([]);
            const [filteredVerses, setFilteredVerses] = React.useState([]);
            const [selectedLanguage, setSelectedLanguage] = React.useState('english');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [bookmarks, setBookmarks] = React.useState([]);
            const [selectedSurah, setSelectedSurah] = React.useState('all');
            const [selectedAyah, setSelectedAyah] = React.useState('');
            const [showNavigation, setShowNavigation] = React.useState(false);
            const [loading, setLoading] = React.useState(true);
            const [wordByWordData, setWordByWordData] = React.useState({});
            const [loadingWords, setLoadingWords] = React.useState({});
            const [editMode, setEditMode] = React.useState(false);
            const [editingVerse, setEditingVerse] = React.useState(null);
            const [showAdmin, setShowAdmin] = React.useState(false);

            // Load data from Excel when page loads
            React.useEffect(() => {
                const loadData = async () => {
                    try {
                        const response = await fetch(EXCEL_FILE_NAME);
                        const arrayBuffer = await response.arrayBuffer();
                        const workbook = XLSX.read(arrayBuffer);
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet);
                        setVerses(jsonData);
                        setFilteredVerses(jsonData);
                        setLoading(false);
                    } catch (error) {
                        console.error('Error loading Excel file:', error);
                        alert('Error loading Quran data. Please check if the Excel file is uploaded correctly.');
                        setLoading(false);
                    }
                };
                loadData();
            }, []);

            // Load bookmarks from browser memory
            React.useEffect(() => {
                const saved = localStorage.getItem('quranBookmarks');
                if (saved) {
                    setBookmarks(JSON.parse(saved));
                }
            }, []);

            // Get unique Surahs for dropdown
            const surahs = React.useMemo(() => {
                const surahSet = new Set(verses.map(v => v.Surah));
                return Array.from(surahSet).sort((a, b) => a - b);
            }, [verses]);

            // Filter verses based on search and selection
            React.useEffect(() => {
                let filtered = verses;

                if (selectedSurah !== 'all') {
                    filtered = filtered.filter(v => v.Surah === parseInt(selectedSurah));
                    
                    if (selectedAyah) {
                        filtered = filtered.filter(v => v.Ayah === parseInt(selectedAyah));
                    }
                }

                if (searchQuery.trim()) {
                    const query = searchQuery.toLowerCase();
                    filtered = filtered.filter(v => 
                        v.Arabic?.toLowerCase().includes(query) ||
                        v.English?.toLowerCase().includes(query) ||
                        v.Tamil?.toLowerCase().includes(query)
                    );
                }

                setFilteredVerses(filtered);
            }, [searchQuery, selectedSurah, selectedAyah, verses]);

            // Fetch word-by-word translation from Quran.com API
            const fetchWordByWord = async (surah, ayah) => {
                const key = `${surah}:${ayah}`;
                if (wordByWordData[key] || loadingWords[key]) return;

                setLoadingWords(prev => ({ ...prev, [key]: true }));

                try {
                    const response = await fetch(
                        `https://api.quran.com/api/v4/verses/by_key/${surah}:${ayah}?language=en&words=true&word_fields=text_uthmani,transliteration,translation`
                    );
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.verse && data.verse.words) {
                            setWordByWordData(prev => ({
                                ...prev,
                                [key]: data.verse.words
                            }));
                        }
                    }
                } catch (error) {
                    console.error('Error fetching word-by-word:', error);
                } finally {
                    setLoadingWords(prev => ({ ...prev, [key]: false }));
                }
            };

            // Toggle bookmark
            const toggleBookmark = (verseId) => {
                const newBookmarks = bookmarks.includes(verseId)
                    ? bookmarks.filter(id => id !== verseId)
                    : [...bookmarks, verseId];
                setBookmarks(newBookmarks);
                localStorage.setItem('quranBookmarks', JSON.stringify(newBookmarks));
            };

            // Edit functions
            const startEdit = (verse) => {
                setEditingVerse({
                    ...verse,
                    EnglishSubtitle: verse.EnglishSubtitle || '',
                    EnglishFootnote: verse.EnglishFootnote || '',
                    TamilSubtitle: verse.TamilSubtitle || '',
                    TamilFootnote: verse.TamilFootnote || ''
                });
                setEditMode(true);
            };

            const saveEdit = () => {
                if (!editingVerse) return;
                
                const updatedVerses = verses.map(v => 
                    v.ID === editingVerse.ID ? editingVerse : v
                );
                setVerses(updatedVerses);
                setEditMode(false);
                setEditingVerse(null);
                alert('✅ Changes saved! (Note: This saves temporarily. Contact admin for permanent database save.)');
            };

            const cancelEdit = () => {
                setEditMode(false);
                setEditingVerse(null);
            };

            // Get Surah names
            const getSurahName = (surahNum) => {
                const names = {
                    1: 'Al-Fatihah', 2: 'Al-Baqarah', 3: 'Ali Imran', 4: 'An-Nisa',
                    5: 'Al-Maidah', 6: 'Al-Anam', 7: 'Al-Araf', 8: 'Al-Anfal',
                    9: 'At-Tawbah', 10: 'Yunus', 11: 'Hud', 12: 'Yusuf'
                };
                return names[surahNum] || `Surah ${surahNum}`;
            };

            // Render Arabic with tooltips
            const renderArabicWithTooltips = (verse) => {
                const key = `${verse.Surah}:${verse.Ayah}`;
                const words = wordByWordData[key];

                if (!words || !verse.Ayah) {
                    return React.createElement('p', {
                        className: 'text-3xl leading-loose font-arabic text-gray-800 cursor-pointer text-right',
                        onClick: () => verse.Ayah && fetchWordByWord(verse.Surah, verse.Ayah),
                        style: { fontFamily: "'Amiri', 'Traditional Arabic', serif", direction: 'rtl' }
                    }, [
                        verse.Arabic,
                        verse.Ayah && !loadingWords[key] && React.createElement('span', {
                            key: 'hint',
                            className: 'text-sm text-emerald-600 mr-3',
                            style: { direction: 'ltr' }
                        }, ' (Click for word meanings)')
                    ]);
                }

                return React.createElement('div', {
                    className: 'text-3xl leading-loose font-arabic text-gray-800 text-right',
                    style: { fontFamily: "'Amiri', 'Traditional Arabic', serif", direction: 'rtl' }
                }, words.map((word, index) =>
                    React.createElement('span', {
                        key: index,
                        className: 'inline-block mx-1 relative group cursor-pointer hover:text-emerald-600 transition-colors'
                    }, [
                        word.text_uthmani || word.text,
                        React.createElement('span', {
                            key: 'tooltip',
                            className: 'invisible group-hover:visible absolute bottom-full left-1/2 transform -translate-x-1/2 mb-2 px-3 py-2 bg-gray-900 text-white text-sm rounded-lg shadow-lg whitespace-nowrap z-10'
                        }, [
                            React.createElement('span', {
                                key: 'trans',
                                className: 'block text-xs text-emerald-300 mb-1'
                            }, word.transliteration?.text || word.transliteration),
                            React.createElement('span', {
                                key: 'meaning',
                                className: 'block font-normal'
                            }, word.translation?.text || word.translation || 'Loading...')
                        ])
                    ])
                ));
            };

            if (loading) {
                return React.createElement('div', {
                    className: 'min-h-screen bg-gradient-to-b from-emerald-50 to-white flex items-center justify-center'
                }, React.createElement('div', { className: 'text-center' }, [
                    React.createElement('div', { key: 'icon', className: 'text-4xl mb-4' }, '☪'),
                    React.createElement('div', { key: 'text1', className: 'text-xl text-emerald-700' }, 'Loading Holy Quran...'),
                    React.createElement('div', { key: 'text2', className: 'text-sm text-emerald-600 mt-2' }, 'جاري التحميل...')
                ]));
            }

            // Main render
            return React.createElement('div', {
                className: 'min-h-screen bg-gradient-to-b from-emerald-50 via-white to-emerald-50'
            }, [
                // Header
                React.createElement('header', {
                    key: 'header',
                    className: 'bg-gradient-to-r from-emerald-600 to-emerald-700 text-white shadow-lg sticky top-0 z-50'
                }, React.createElement('div', { className: 'container mx-auto px-4 py-4' }, [
                    // Top bar
                    React.createElement('div', {
                        key: 'topbar',
                        className: 'flex items-center justify-between'
                    }, [
                        React.createElement('div', {
                            key: 'logo',
                            className: 'flex items-center space-x-3'
                        }, [
                            React.createElement(Book, { key: 'icon', className: 'w-8 h-8' }),
                            React.createElement('div', { key: 'title' }, [
                                React.createElement('h1', {
                                    key: 'h1',
                                    className: 'text-2xl font-bold'
                                }, 'القرآن الكريم'),
                                React.createElement('p', {
                                    key: 'subtitle',
                                    className: 'text-xs text-emerald-100'
                                }, 'The Holy Quran')
                            ])
                        ]),
                        React.createElement('div', {
                            key: 'buttons',
                            className: 'flex items-center space-x-2'
                        }, [
                            React.createElement('button', {
                                key: 'admin',
                                onClick: () => setShowAdmin(!showAdmin),
                                className: 'hidden md:block px-3 py-1 text-xs bg-emerald-500 hover:bg-emerald-400 rounded'
                            }, showAdmin ? '👁️ Reader' : '⚙️ Admin'),
                            React.createElement('button', {
                                key: 'menu',
                                onClick: () => setShowNavigation(!showNavigation),
                                className: 'lg:hidden p-2 hover:bg-emerald-500 rounded-lg'
                            }, showNavigation ? React.createElement(X) : React.createElement(Menu))
                        ])
                    ]),
                    // Navigation controls
                    React.createElement('div', {
                        key: 'nav',
                        className: `mt-4 space-y-3 ${showNavigation ? 'block' : 'hidden lg:block'}`
                    }, [
                        // Search
                        React.createElement('div', {
                            key: 'search',
                            className: 'relative'
                        }, [
                            React.createElement(Search, {
                                key: 'icon',
                                className: 'absolute left-3 top-3 w-5 h-5 text-emerald-300'
                            }),
                            React.createElement('input', {
                                key: 'input',
                                type: 'text',
                                placeholder: 'Search in Arabic, English, or Tamil...',
                                value: searchQuery,
                                onChange: (e) => setSearchQuery(e.target.value),
                                className: 'w-full pl-10 pr-4 py-2.5 rounded-lg bg-white/20 text-white placeholder-emerald-200 border border-emerald-400 focus:outline-none focus:ring-2 focus:ring-white'
                            })
                        ]),
                        // Filters
                        React.createElement('div', {
                            key: 'filters',
                            className: 'grid grid-cols-1 md:grid-cols-3 gap-3'
                        }, [
                            // Language
                            React.createElement('select', {
                                key: 'lang',
                                value: selectedLanguage,
                                onChange: (e) => setSelectedLanguage(e.target.value),
                                className: 'px-4 py-2.5 rounded-lg bg-white/20 text-white border border-emerald-400 cursor-pointer'
                            }, [
                                React.createElement('option', { key: 'en', value: 'english', className: 'text-gray-900' }, 'English + عربي'),
                                React.createElement('option', { key: 'ta', value: 'tamil', className: 'text-gray-900' }, 'தமிழ் + عربي'),
                                React.createElement('option', { key: 'both', value: 'both', className: 'text-gray-900' }, 'All Languages')
                            ]),
                            // Surah
                            React.createElement('select', {
                                key: 'surah',
                                value: selectedSurah,
                                onChange: (e) => {
                                    setSelectedSurah(e.target.value);
                                    setSelectedAyah('');
                                },
                                className: 'px-4 py-2.5 rounded-lg bg-white/20 text-white border border-emerald-400 cursor-pointer'
                            }, [
                                React.createElement('option', { key: 'all', value: 'all', className: 'text-gray-900' }, 'All Surahs'),
                                ...surahs.map(s => React.createElement('option', {
                                    key: s,
                                    value: s,
                                    className: 'text-gray-900'
                                }, `Surah ${s} - ${getSurahName(s)}`))
                            ]),
                            // Ayah
                            React.createElement('input', {
                                key: 'ayah',
                                type: 'number',
                                placeholder: 'Go to Ayah...',
                                value: selectedAyah,
                                onChange: (e) => setSelectedAyah(e.target.value),
                                disabled: selectedSurah === 'all',
                                className: 'px-4 py-2.5 rounded-lg bg-white/20 text-white placeholder-emerald-200 border border-emerald-400 focus:outline-none disabled:opacity-50'
                            })
                        ]),
                        // Info
                        React.createElement('div', {
                            key: 'info',
                            className: 'text-sm text-emerald-100 flex items-center justify-between'
                        }, [
                            React.createElement('span', { key: 'count' }, `Showing ${filteredVerses.length} verses`),
                            React.createElement('span', { key: 'bookmarks' }, `${bookmarks.length} bookmarks`)
                        ])
                    ])
                ])),
                
                // Main content
                React.createElement('main', {
                    key: 'main',
                    className: 'container mx-auto px-4 py-8'
                }, [
                    // Info banner
                    React.createElement('div', {
                        key: 'banner',
                        className: 'mb-6 bg-emerald-50 border border-emerald-200 rounded-lg p-4 text-center'
                    }, React.createElement('p', { className: 'text-emerald-800 text-sm' }, [
                        React.createElement('span', { key: 'bold', className: 'font-semibold' }, '✨ Interactive Feature: '),
                        'Click on any verse or hover over Arabic words to see word-by-word English meanings'
                    ])),
                    
                    // Verses
                    React.createElement('div', { key: 'verses', className: 'space-y-6' },
                        filteredVerses.length === 0 ? 
                            React.createElement('div', { className: 'text-center py-12' }, [
                                React.createElement('div', { key: 'icon', className: 'text-6xl mb-4' }, '🔍'),
                                React.createElement('p', { key: 'text1', className: 'text-xl text-gray-600' }, 'No verses found'),
                                React.createElement('p', { key: 'text2', className: 'text-sm text-gray-500 mt-2' }, 'Try adjusting your search or filters')
                            ])
                        :
                            filteredVerses.map(verse => React.createElement('div', {
                                key: verse.ID,
                                className: 'bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden border-l-4 border-emerald-500'
                            }, editMode && editingVerse?.ID === verse.ID ?
                                // Edit mode
                                React.createElement('div', { className: 'p-6 bg-emerald-50' }, 'EDITING MODE - Use admin panel')
                            :
                                // View mode
                                React.createElement('div', { className: 'p-6' }, [
                                    // Header
                                    React.createElement('div', {
                                        key: 'header',
                                        className: 'flex items-center justify-between mb-4 pb-3 border-b border-gray-200'
                                    }, [
                                        React.createElement('div', {
                                            key: 'info',
                                            className: 'flex items-center space-x-3'
                                        }, [
                                            React.createElement('div', {
                                                key: 'badge',
                                                className: 'bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-sm font-semibold'
                                            }, `${verse.Surah}:${verse.Ayah || '-'}`),
                                            React.createElement('span', {
                                                key: 'name',
                                                className: 'text-sm text-gray-600'
                                            }, getSurahName(verse.Surah))
                                        ]),
                                        React.createElement('div', {
                                            key: 'actions',
                                            className: 'flex space-x-2'
                                        }, [
                                            showAdmin && React.createElement('button', {
                                                key: 'edit',
                                                onClick: () => startEdit(verse),
                                                className: 'p-2 rounded-lg hover:bg-emerald-100 text-emerald-600'
                                            }, '✏️'),
                                            React.createElement('button', {
                                                key: 'bookmark',
                                                onClick: () => toggleBookmark(verse.ID),
                                                className: `p-2 rounded-lg transition-colors ${
                                                    bookmarks.includes(verse.ID) ? 'bg-emerald-100 text-emerald-600' : 'hover:bg-gray-100 text-gray-400'
                                                }`
                                            }, bookmarks.includes(verse.ID) ? 
                                                React.createElement(BookmarkCheck, { className: 'w-5 h-5' }) : 
                                                React.createElement(BookmarkPlus, { className: 'w-5 h-5' })
                                            )
                                        ])
                                    ]),
                                    
                                    // Arabic
                                    React.createElement('div', {
                                        key: 'arabic',
                                        className: 'mb-6'
                                    }, renderArabicWithTooltips(verse)),
                                    
                                    // Translations
                                    React.createElement('div', {
                                        key: 'translations',
                                        className: 'space-y-3'
                                    }, [
                                        (selectedLanguage === 'english' || selectedLanguage === 'both') && verse.English &&
                                            React.createElement('div', {
                                                key: 'en',
                                                className: 'bg-blue-50 p-4 rounded-lg'
                                            }, [
                                                React.createElement('p', {
                                                    key: 'label',
                                                    className: 'text-sm font-semibold text-blue-700 mb-1'
                                                }, 'English'),
                                                verse.EnglishSubtitle && React.createElement('p', {
                                                    key: 'subtitle',
                                                    className: 'text-xs text-blue-600 italic mb-2'
                                                }, `📌 ${verse.EnglishSubtitle}`),
                                                React.createElement('p', {
                                                    key: 'text',
                                                    className: 'text-gray-800 leading-relaxed'
                                                }, verse.English),
                                                verse.EnglishFootnote && React.createElement('p', {
                                                    key: 'footnote',
                                                    className: 'text-xs text-blue-600 mt-2 pt-2 border-t border-blue-200'
                                                }, `* ${verse.EnglishFootnote}`)
                                            ]),
                                        
                                        (selectedLanguage === 'tamil' || selectedLanguage === 'both') && verse.Tamil &&
                                            React.createElement('div', {
                                                key: 'ta',
                                                className: 'bg-orange-50 p-4 rounded-lg'
                                            }, [
                                                React.createElement('p', {
                                                    key: 'label',
                                                    className: 'text-sm font-semibold text-orange-700 mb-1'
                                                }, 'தமிழ் (Tamil)'),
                                                verse.TamilSubtitle && React.createElement('p', {
                                                    key: 'subtitle',
                                                    className: 'text-xs text-orange-600 italic mb-2'
                                                }, `📌 ${verse.TamilSubtitle}`),
                                                React.createElement('p', {
                                                    key: 'text',
                                                    className: 'text-gray-800 leading-relaxed'
                                                }, verse.Tamil),
                                                verse.TamilFootnote && React.createElement('p', {
                                                    key: 'footnote',
                                                    className: 'text-xs text-orange-600 mt-2 pt-2 border-t border-orange-200'
                                                }, `* ${verse.TamilFootnote}`)
                                            ])
                                    ])
                                ])
                            ))
                    )
                ]),
                
                // Footer
                React.createElement('footer', {
                    key: 'footer',
                    className: 'bg-emerald-800 text-white py-6 mt-12'
                }, React.createElement('div', { className: 'container mx-auto px-4 text-center' }, [
                    React.createElement('p', { key: 'text1', className: 'text-sm' }, 
                        'May Allah accept our efforts and guide us to the straight path'
                    ),
                    React.createElement('p', { key: 'text2', className: 'text-xs text-emerald-300 mt-2' }, 
                        'Alhamdulillah • الحمد لله'
                    )
                ]))
            ]);
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(QuranReader));
    </script>
</body>
</html>
